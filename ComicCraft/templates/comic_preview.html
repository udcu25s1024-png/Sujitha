<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{comic.title}}</title><link rel="stylesheet" href="/static/css/styles.css"></head><body><main class="container"><h1>{{comic.title}}</h1>{% for p in comic.panels %}<section class="panel"><h2>Panel {{p.panel_number}} — {{p.title}}</h2><img src="{{p.image_url}}"><p><b>Scene:</b> {{p.scene_description}}</p><p><b>Caption:</b> {{p.caption}}</p><p><b>Dialogue:</b> {{p.dialogue}}</p><p><b>Narration:</b> {{p.narration}}</p></section>{% endfor %}<a class="button" href="{{comic.pdf_url}}" download>Download PDF</a> <a href="/">Create another</a></main></body></html>
